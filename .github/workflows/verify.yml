name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node tests/planner.test.mjs
      - run: node tests/embeds.test.mjs
      - run: node tests/ai.test.mjs
      - run: node tests/ai-apply.test.mjs
      - run: node tests/ai-ui.test.mjs
      - run: node tests/creator-profile.test.mjs
      - run: npm run build
